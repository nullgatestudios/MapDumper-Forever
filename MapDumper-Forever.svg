<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- MapDumper - Forever: a folded map exporting its IDs as JSON -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232d3d"/>
      <stop offset="1" stop-color="#0f141c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d27a"/>
      <stop offset="0.5" stop-color="#c9a54e"/>
      <stop offset="1" stop-color="#8a6a26"/>
    </linearGradient>
    <linearGradient id="paperA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e6bf"/>
      <stop offset="1" stop-color="#d8bd84"/>
    </linearGradient>
    <linearGradient id="paperB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2cc98"/>
      <stop offset="1" stop-color="#bf9f62"/>
    </linearGradient>
    <linearGradient id="data" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fe2ff"/>
      <stop offset="1" stop-color="#2f8ad6"/>
    </linearGradient>
    <radialGradient id="arcane" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7ac8ff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#2a5ac2" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- frame -->
  <rect x="20" y="20" width="472" height="472" rx="64" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="64" fill="none" stroke="url(#gold)" stroke-width="16"/>
  <rect x="44" y="44" width="424" height="424" rx="44" fill="none" stroke="#c9a54e" stroke-opacity="0.35" stroke-width="3"/>

  <circle cx="256" cy="256" r="190" fill="url(#arcane)"/>

  <!-- folded map (three panels), lower left -->
  <g transform="translate(-34,40)">
    <ellipse cx="216" cy="402" rx="120" ry="14" fill="#000000" opacity="0.35"/>
    <path d="M96 170 L176 146 L256 170 L336 146 L336 366 L256 390 L176 366 L96 390 Z" fill="#e6c98a" opacity="0.4" filter="url(#glow)"/>
    <path d="M96 170 L176 146 L176 366 L96 390 Z" fill="url(#paperA)" stroke="#6e5226" stroke-width="5" stroke-linejoin="round"/>
    <path d="M176 146 L256 170 L256 390 L176 366 Z" fill="url(#paperB)" stroke="#6e5226" stroke-width="5" stroke-linejoin="round"/>
    <path d="M256 170 L336 146 L336 366 L256 390 Z" fill="url(#paperA)" stroke="#6e5226" stroke-width="5" stroke-linejoin="round"/>
    <!-- coastline and route -->
    <path d="M110 230 q30 -20 54 4 q22 22 44 -2 q26 -26 56 6 q28 30 60 -6" fill="none" stroke="#3a7ab8" stroke-width="6" stroke-linecap="round"/>
    <path d="M120 330 q40 -40 80 -10 t90 -30" fill="none" stroke="#8a3a2a" stroke-width="5" stroke-dasharray="10 10" stroke-linecap="round"/>
    <!-- map pins -->
    <path d="M300 292 c-14 0 -24 10 -24 23 c0 18 24 39 24 39 s24 -21 24 -39 c0 -13 -10 -23 -24 -23 Z" fill="#e04a4a" stroke="#6e1a1a" stroke-width="4"/>
    <circle cx="300" cy="315" r="8" fill="#ffffff"/>
    <circle cx="136" cy="300" r="9" fill="#2f8ad6" stroke="#0f3a66" stroke-width="3"/>
  </g>

  <g transform="translate(8,-6) translate(368,166) scale(0.82) translate(-368,-166)">
  <!-- JSON braces rising from the map, upper right -->
  <g filter="url(#glow)" opacity="0.6">
    <path d="M330 92 q-26 0 -26 26 v30 q0 18 -18 18 q18 0 18 18 v30 q0 26 26 26" fill="none" stroke="#4fb4ff" stroke-width="16"/>
    <path d="M406 92 q26 0 26 26 v30 q0 18 18 18 q-18 0 -18 18 v30 q0 26 -26 26" fill="none" stroke="#4fb4ff" stroke-width="16"/>
  </g>
  <path d="M330 92 q-26 0 -26 26 v30 q0 18 -18 18 q18 0 18 18 v30 q0 26 26 26" fill="none" stroke="url(#data)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M406 92 q26 0 26 26 v30 q0 18 18 18 q-18 0 -18 18 v30 q0 26 -26 26" fill="none" stroke="url(#data)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- data lines inside the braces -->
  <g stroke-linecap="round" stroke-width="9">
    <path d="M334 136 H404" stroke="#cfeaff"/>
    <path d="M334 166 H388" stroke="#9fe2ff"/>
    <path d="M334 196 H398" stroke="#cfeaff"/>
  </g>

  </g>

  <!-- export arrow from map to braces -->
  <path d="M236 196 Q246 150 280 134" fill="none" stroke="#f0d27a" stroke-width="10" stroke-linecap="round"/>
  <path d="M268 120 L296 128 L276 150 Z" fill="#f0d27a" stroke="#8a6a26" stroke-width="3" stroke-linejoin="round"/>

  <!-- sparkles -->
  <path d="M110 96 l6 15 l15 6 l-15 6 l-6 15 l-6 -15 l-15 -6 l15 -6 Z" fill="#cfeaff"/>
  <circle cx="432" cy="420" r="6" fill="#cfeaff"/>
  <circle cx="210" cy="104" r="5" fill="#cfeaff" opacity="0.8"/>
</svg>
